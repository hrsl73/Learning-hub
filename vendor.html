<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Services — Low-Level Design Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
:root {
  --font-display: 'Sora', sans-serif;
  --font-sans: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --brand: #8a1e47;
  --brand-soft: #f4e3ea;
  --brand-text: #6e1539;
  --radius-sm: 6px;
  --radius-md: 9px;
  --radius-lg: 14px;
}
[data-theme="light"] {
  --bg: #f6f4ef;
  --bg-grid: rgba(138,30,71,0.035);
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --surface-3: #e9e5dc;
  --text: #211f1d;
  --text-2: #5f5c56;
  --text-3: #8d8a82;
  --border: rgba(33,31,29,0.10);
  --border-2: rgba(33,31,29,0.18);
  --accent: #8a1e47;
  --accent-soft: #f6e1ea;
  --accent-text: #6e1539;
  --info-bg: #e6f1fb; --info-text: #0c447c; --info-border: #85b7eb;
  --ok-bg: #e1f5ee; --ok-text: #0f6e56; --ok-border: #5dcaa5;
  --warn-bg: #faeeda; --warn-text: #633806; --warn-border: #ef9f27;
  --err-bg: #fcebeb; --err-text: #a32d2d; --err-border: #f09595;
  --end-bg: #eeedfe; --end-text: #3c3489; --end-border: #afa9ec;
  --miss-bg: #faece7; --miss-text: #712b13; --miss-border: #d85a30;
  --shadow: 0 1px 2px rgba(33,31,29,0.04), 0 8px 24px rgba(33,31,29,0.05);
}
[data-theme="dark"] {
  --bg: #16140f;
  --bg-grid: rgba(244,201,219,0.025);
  --surface: #211e18;
  --surface-2: #2a261f;
  --surface-3: #332e26;
  --text: #f0ede4;
  --text-2: #b6b2a8;
  --text-3: #87837a;
  --border: rgba(255,255,255,0.09);
  --border-2: rgba(255,255,255,0.16);
  --accent: #e07a9e;
  --accent-soft: #3a1626;
  --accent-text: #f4c0d1;
  --info-bg: #0c2f50; --info-text: #b5d4f4; --info-border: #2d6093;
  --ok-bg: #0c3329; --ok-text: #9fe1cb; --ok-border: #2a7a64;
  --warn-bg: #3a2510; --warn-text: #fac775; --warn-border: #8a5a1e;
  --err-bg: #3a1818; --err-text: #f0a0a0; --err-border: #7a3535;
  --end-bg: #251f3e; --end-text: #cecbf6; --end-border: #4a4290;
  --miss-bg: #361a10; --miss-text: #f0a884; --miss-border: #8a4527;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }

/* Header */
header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--border);
}
.header-inner { max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand-mark { display: flex; align-items: center; gap: 11px; }
.brand-dot { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 19px; flex-shrink: 0; }
[data-theme="dark"] .brand-dot { color: #16140f; }
.brand-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; line-height: 1.2; }
.brand-sub { font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); }
.created-by { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--radius-md); background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-text); }
.created-by i { font-size: 15px; }
.created-by .cb-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-text); font-family: var(--font-mono); }
.created-by .cb-names { font-size: 12.5px; font-weight: 600; color: var(--accent-text); font-family: var(--font-display); white-space: nowrap; }
.view-nav { display: flex; gap: 5px; margin-left: auto; background: var(--surface-2); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border); flex-wrap: wrap; }
.view-btn {
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  padding: 8px 15px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  background: transparent; color: var(--text-2); transition: all .18s; display: flex; align-items: center; gap: 7px; white-space: nowrap;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
[data-theme="dark"] .view-btn.active { color: #16140f; }
.theme-toggle { width: 38px; height: 38px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; display: grid; place-items: center; font-size: 18px; transition: all .18s; }
.theme-toggle:hover { color: var(--accent); border-color: var(--border-2); }

/* Hero per view */
.view-hero { padding: 40px 0 26px; }
.view-hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 40px); letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 12px; }
.view-hero h1 .em { color: var(--accent); }
.view-hero p { color: var(--text-2); font-size: 15px; max-width: 720px; }
.hero-meta { display: flex; gap: 22px; margin-top: 20px; flex-wrap: wrap; }
.hero-meta div { display: flex; flex-direction: column; }
.hero-meta .num { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--text); }
.hero-meta .lbl { font-size: 12px; color: var(--text-3); font-family: var(--font-mono); }

/* View */
.view { display: none; }
.view.active { display: block; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Module tabs */
.mod-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
.mod-tab {
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  padding: 8px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer; transition: all .16s;
}
.mod-tab:hover { border-color: var(--border-2); color: var(--text); }
.mod-tab.active { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; font-size: 12px; color: var(--text-2); padding: 13px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.ldot { width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; border: 1px solid; }

/* Module panel */
.mod { display: none; }
.mod.active { display: block; animation: fade .3s ease; }
.mod-head { margin-bottom: 18px; }
.mod-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.015em; margin-bottom: 7px; }
.mod-head p { color: var(--text-2); font-size: 14px; max-width: 760px; }
.mod-stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 22px; }
.mod-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px 16px; min-width: 120px; }
.mod-stat .v { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.mod-stat .l { font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); }

/* Flow nodes */
.flow { position: relative; }
.node { display: flex; align-items: flex-start; gap: 11px; padding: 12px 15px; border-radius: var(--radius-md); margin-bottom: 5px; font-size: 13.5px; line-height: 1.5; border: 1px solid var(--border); background: var(--surface); }
.node i.ni { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
.node.start { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); font-weight: 500; }
.node.step { background: var(--surface); border-left: 3px solid var(--accent); }
.node.decision { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); font-weight: 500; }
.node.success { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.node.error { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
.node.warning { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
.node.end { background: var(--end-bg); color: var(--end-text); border-color: var(--end-border); font-weight: 500; }
.node.missing { background: var(--miss-bg); color: var(--miss-text); border: 1px dashed var(--miss-border); border-left-width: 3px; font-style: italic; }
.arrow { display: flex; align-items: center; padding-left: 30px; height: 20px; position: relative; }
.arrow::before { content: ''; position: absolute; left: 30px; top: 0; width: 1.5px; height: 100%; background: var(--border-2); }
.arrow::after { content: ''; position: absolute; left: 26px; bottom: 1px; width: 7px; height: 7px; border-left: 1.5px solid var(--border-2); border-bottom: 1.5px solid var(--border-2); transform: rotate(-45deg); }
.branch { margin-left: 26px; border-left: 1.5px dashed var(--border-2); padding-left: 18px; margin-bottom: 5px; }
.branch-lbl { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 10px 0 7px; padding: 4px 11px; background: var(--surface-2); border-radius: var(--radius-sm); display: inline-block; border: 1px solid var(--border); }

/* Swimlane */
.lane-head { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-bottom: 12px; position: sticky; top: 70px; z-index: 20; }
.lane-title { text-align: center; padding: 11px 8px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid; }
.lane-cust { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); }
.lane-plat { background: var(--end-bg); color: var(--end-text); border-color: var(--end-border); }
.lane-vend { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.phase-band { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--surface-2); padding: 8px 14px; border-radius: var(--radius-md); margin: 18px 0 10px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); }
.phase-num { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: var(--font-mono); }
[data-theme="dark"] .phase-num { color: #16140f; }
.lane-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-bottom: 7px; }
.lane-cell { display: flex; }
.act { width: 100%; border-radius: var(--radius-md); padding: 11px 13px; font-size: 12.5px; line-height: 1.45; border: 1px solid var(--border); }
.act.cust { background: var(--info-bg); border-color: var(--info-border); }
.act.plat { background: var(--end-bg); border-color: var(--end-border); }
.act.vend { background: var(--ok-bg); border-color: var(--ok-border); }
.act.dec { background: var(--warn-bg); border-color: var(--warn-border); }
.act.dec .act-t { color: var(--warn-text); }
.act.isnew { border-style: dashed; border-width: 1.5px; }
.act-t { font-weight: 600; display: block; margin-bottom: 3px; color: var(--text); }
.act.cust .act-t { color: var(--info-text); } .act.plat .act-t { color: var(--end-text); } .act.vend .act-t { color: var(--ok-text); }
.act-id { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-right: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); }
.act-d { color: var(--text-2); font-size: 12px; }
[data-theme="light"] .act.cust .act-d, [data-theme="light"] .act.plat .act-d, [data-theme="light"] .act.vend .act-d, [data-theme="light"] .act.dec .act-d { color: color-mix(in srgb, currentColor 75%, var(--text)); }
.act-tag { display: inline-block; font-size: 9.5px; padding: 1px 6px; border-radius: 4px; background: var(--miss-bg); color: var(--miss-text); margin-left: 5px; font-style: normal; font-weight: 500; border: 1px solid var(--miss-border); }
.handoff { font-size: 10.5px; color: var(--text-3); display: flex; align-items: flex-start; gap: 5px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-2); }
.lane-flow { text-align: center; color: var(--text-3); font-size: 13px; margin: 1px 0; }

footer { margin-top: 50px; padding-top: 22px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; font-family: var(--font-mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

@media (max-width: 760px) {
  .lane-head, .lane-row { grid-template-columns: 1fr; }
  .lane-head { display: none; }
  .act::before { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); display: block; margin-bottom: 4px; }
  .act.cust::before { content: 'CUSTOMER'; } .act.plat::before { content: 'PLATFORM'; } .act.vend::before { content: 'VENDOR'; }
  .view-nav { width: 100%; margin-left: 0; }
}

/* Sequence / deep-dive view */
.seq-note { display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--text-2); padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius-md); margin-bottom:22px; }
.seq-note i { color:var(--accent); font-size:17px; margin-top:1px; flex-shrink:0; }
.seq-diagram { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 18px; margin-bottom:16px; overflow-x:auto; box-shadow:var(--shadow); }
.seq-diagram .mermaid { text-align:center; min-height:40px; }
.seq-diagram .mermaid svg { max-width:100%; height:auto; }
.seq-diagram .mermaid .seq-loading { color:var(--text-3); font-size:13px; font-family:var(--font-mono); padding:20px; }
.spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:6px 0 8px; }
.spec-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; }
.spec-card h4 { font-family:var(--font-display); font-size:13px; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px; color:var(--text); }
.spec-card h4 i { color:var(--accent); font-size:16px; }
.spec-card ul { list-style:none; display:flex; flex-direction:column; gap:7px; }
.spec-card li { font-size:12.5px; color:var(--text-2); padding-left:15px; position:relative; line-height:1.5; }
.spec-card li::before { content:''; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
.spec-card code { font-family:var(--font-mono); font-size:11px; background:var(--surface-2); padding:1px 5px; border-radius:4px; border:1px solid var(--border); color:var(--accent-text); }
.spec-card .mth { font-family:var(--font-mono); font-size:9.5px; font-weight:600; padding:1px 5px; border-radius:4px; margin-right:5px; border:1px solid; }
.mth.get { background:var(--info-bg); color:var(--info-text); border-color:var(--info-border); }
.mth.post { background:var(--ok-bg); color:var(--ok-text); border-color:var(--ok-border); }
.mth.ws { background:var(--end-bg); color:var(--end-text); border-color:var(--end-border); }
.mth.evt { background:var(--warn-bg); color:var(--warn-text); border-color:var(--warn-border); }
@media (max-width: 760px) { .spec-grid { grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand-mark">
      <div class="brand-dot"><i class="ti ti-sitemap"></i></div>
      <div>
        <div class="brand-title">Home Services Platform</div>
        <div class="brand-sub">low-level design · architecture</div>
      </div>
    </div>
    <div class="created-by"><i class="ti ti-users"></i><span class="cb-label">Created by</span><span class="cb-names">Bhargav · Kunj · Jaydeep</span></div>
    <nav class="view-nav" id="viewNav">
      <button class="view-btn active" data-view="vendor"><i class="ti ti-tools"></i>Vendor flow</button>
      <button class="view-btn" data-view="user"><i class="ti ti-user"></i>User booking</button>
      <button class="view-btn" data-view="e2e"><i class="ti ti-arrows-exchange"></i>End-to-end</button>
      <button class="view-btn" data-view="seq"><i class="ti ti-timeline-event"></i>Deep dive</button>
      <button class="view-btn" data-view="dispatch"><i class="ti ti-broadcast"></i>Slot dispatch</button>
      <button class="view-btn" data-view="flow"><i class="ti ti-route"></i>Workflow</button>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="ti ti-moon"></i></button>
  </div>
</header>

<div class="wrap">
  <section class="view active" id="view-vendor"></section>
  <section class="view" id="view-user"></section>
  <section class="view" id="view-e2e"></section>
  <section class="view" id="view-seq"></section>
  <section class="view" id="view-dispatch"></section>
  <section class="view" id="view-flow"></section>

  <footer>
    <span>Home Services LLD — vendor · customer · end-to-end · slot dispatch</span>
    <span id="footStamp"></span>
  </footer>
</div>

<script>
/* ============ DATA ============ */
const LEGEND = [
  ['start','Start / trigger','var(--info-bg)','var(--info-border)'],
  ['step','Action step','var(--surface)','var(--accent)'],
  ['decision','Decision point','var(--warn-bg)','var(--warn-border)'],
  ['success','Success','var(--ok-bg)','var(--ok-border)'],
  ['error','Error / fail','var(--err-bg)','var(--err-border)'],
  ['missing','Missing scenario (added)','var(--miss-bg)','var(--miss-border)']
];

const VENDOR = {
  hero: { title:['Vendor flow ','architecture'], desc:'Complete low-level design for the technician/vendor application — registration, dashboard, the full job lifecycle, earnings, profile, and edge cases. Built from 44 Figma screens.', meta:[['9','Modules'],['44','Screens analyzed'],['20+','Gaps identified']] },
  sections: [
    { id:'v-onboarding', label:'1. Registration', title:'Vendor registration & onboarding', subtitle:'Multi-step signup wizard from language selection through profile verification — validation, document upload, and admin approval.', stats:[['14','Total screens'],['6','Decision points'],['~12','API calls']], nodes:[
      {t:'start',i:'ti-player-play',x:'App launched → language selection (English / Hindi / Gujarati)'},
      {t:'step',i:'ti-forms',x:'Create account: first/last name, email, phone, password, confirm'},
      {t:'decision',i:'ti-shield-check',x:'Input validation: email format? phone? password strength? duplicates?'},
      {b:'Validation fails',n:[{t:'error',i:'ti-alert-circle',x:'Inline field errors → user corrects → re-validate'}]},
      {b:'Validation passes',n:[{t:'step',i:'ti-device-mobile',x:'Send OTP to registered mobile number'}]},
      {t:'decision',i:'ti-clock',x:'OTP verification: correct code? within expiry window?'},
      {b:'OTP invalid / expired',n:[{t:'error',i:'ti-refresh',x:'Error → resend OTP (30s cooldown) → max 3 retries'},{t:'missing',i:'ti-lock',x:'MISSING: account lockout after max OTP attempts (30-min cooldown)'}]},
      {b:'OTP verified',n:[{t:'success',i:'ti-check',x:'Phone verified → proceed to role selection'}]},
      {t:'step',i:'ti-user-plus',x:'Choose role → "Join as a Vendor" (benefits listed)'},
      {t:'step',i:'ti-id',x:'Basic profile: business name, shop/flat no., building, area, experience, type'},
      {t:'step',i:'ti-tools',x:'Select services: Plumbing, AC Service, Electrician, Housekeeping, Scrap, Painter'},
      {t:'decision',i:'ti-map-pin',x:'Enable location access?'},
      {b:'Allow location',n:[{t:'step',i:'ti-current-location',x:'Auto-detect GPS → resolve to service area'}]},
      {b:'Enter manually',n:[{t:'step',i:'ti-writing',x:'Manual: state → city → service area (multi-select chips)'}]},
      {t:'step',i:'ti-certificate',x:'Key skills + base price per skill per service area'},
      {t:'step',i:'ti-calendar',x:'Availability: per-day toggle, time slots, emergency + holiday toggles'},

/* ============ RENDER ============ */
function esc(s){ return s; }

function renderLegend(){
  return '<div class="legend">' + LEGEND.map(l =>
    `<span><span class="ldot" style="background:${l[2]};border-color:${l[3]}"></span>${l[1]}</span>`
  ).join('') + '</div>';
}

function renderNode(node){
  if(node.b){
    let h = `<div class="branch"><div class="branch-lbl">${node.b}</div>`;
    node.n.forEach(n => { h += renderNode(n); });
    return h + '</div>';
  }
  return `<div class="arrow"></div><div class="node ${node.t}"><i class="ti ${node.i} ni" aria-hidden="true"></i><span>${node.x}</span></div>`;
}

  h += '<div class="hero-meta">' + data.hero.meta.map(m => `<div><span class="num">${m[0]}</span><span class="lbl">${m[1]}</span></div>`).join('') + '</div></div>';
  h += `<div class="mod-tabs" data-tabs="${viewId}">`;
  data.sections.forEach((s,i) => { h += `<button class="mod-tab${i===0?' active':''}" data-mod="${s.id}">${s.label}</button>`; });
  h += '</div>';
  h += renderLegend();
  data.sections.forEach((s,i) => {
    h += `<div class="mod${i===0?' active':''}" id="mod-${s.id}">`;
    h += `<div class="mod-head"><h2>${s.title}</h2><p>${s.subtitle}</p></div>`;
    h += '<div class="mod-stats">' + s.stats.map(st => `<div class="mod-stat"><div class="v">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('') + '</div>';
    h += '<div class="flow">';
    s.nodes.forEach(n => { h += renderNode(n); });
    h += '</div></div>';
  });
  return h;
}

function renderSwimlane(d){
  let h = '<div class="lane-head">' + d.lanes.map(l => `<div class="lane-title lane-${l[0]}"><i class="ti ${l[2]}"></i>${l[1]}</div>`).join('') + '</div>';
  d.phases.forEach(p => {
    h += `<div class="phase-band"><span class="phase-num">${p.num}</span>${p.name}</div>`;
    p.steps.forEach((s,i) => {
      const cells = {cust:'',plat:'',vend:''};
      let cls = `act ${s.lane}${s.dec?' dec':''}${s.isnew?' isnew':''}`;
      let inner = `<span class="act-t"><span class="act-id">${s.id}</span>${s.title}${s.isnew?'<span class="act-tag">new</span>':''}</span><span class="act-d">${s.desc}</span>`;
      if(s.handoff) inner += `<div class="handoff"><i class="ti ti-arrows-exchange"></i><span>${s.handoff}</span></div>`;
      cells[s.lane] = `<div class="${cls}">${inner}</div>`;
      h += `<div class="lane-row"><div class="lane-cell">${cells.cust}</div><div class="lane-cell">${cells.plat}</div><div class="lane-cell">${cells.vend}</div></div>`;
      if(i < p.steps.length-1) h += '<div class="lane-flow"><i class="ti ti-chevron-down"></i></div>';
    });
  });
  return h;
}

function renderE2E(){
  const d = E2E;
  let h = `<div class="view-hero"><h1>${d.hero.title[0]}<span class="em">${d.hero.title[1]}</span></h1><p>${d.hero.desc}</p>`;
  h += '<div class="hero-meta">' + d.hero.meta.map(m => `<div><span class="num">${m[0]}</span><span class="lbl">${m[1]}</span></div>`).join('') + '</div></div>';
  h += renderSwimlane(d);
  return h;
}

function renderDispatch(){
  const d = DISPATCH;
  let h = `<div class="view-hero"><h1>${d.hero.title[0]}<span class="em">${d.hero.title[1]}</span></h1><p>${d.hero.desc}</p>`;
  h += '<div class="hero-meta">' + d.hero.meta.map(m => `<div><span class="num">${m[0]}</span><span class="lbl">${m[1]}</span></div>`).join('') + '</div></div>';
  const tabs = [['sd-e2e','End-to-end'],['sd-flow','Workflow'],['sd-edge','Edge cases · next iteration']];
  h += '<div class="mod-tabs" data-tabs="dispatch">';
  tabs.forEach((t,i) => { h += `<button class="mod-tab${i===0?' active':''}" data-mod="${t[0]}">${t[1]}</button>`; });
  h += '</div>';
  h += '<div class="seq-note"><i class="ti ti-info-circle"></i><span>' + d.note + '</span></div>';

  /* Module 1 — end-to-end swimlane */
  h += '<div class="mod active" id="mod-sd-e2e">';
  h += `<div class="mod-head"><h2>${d.e2e.title}</h2><p>${d.e2e.subtitle}</p></div>`;
  h += renderSwimlane(d.e2e);
  h += '</div>';

  /* Module 2 — workflow flowchart */
  h += '<div class="mod" id="mod-sd-flow">';
  h += `<div class="mod-head"><h2>${d.flow.title}</h2><p>${d.flow.subtitle}</p></div>`;
  h += '<div class="seq-diagram"><div class="mermaid" id="mer-sd-flow"><div class="seq-loading">Rendering diagram…</div></div></div>';
  h += '<div class="spec-grid">' + d.flow.cards.map(c => renderSpecCard(c.icon, c.title, c.items)).join('') + '</div>';
  h += '</div>';

  /* Module 3 — edge cases */
  h += '<div class="mod" id="mod-sd-edge">';
  h += `<div class="mod-head"><h2>${d.edge.title}</h2><p>${d.edge.subtitle}</p></div>`;
  h += renderLegend();
  h += '<div class="flow">' + d.edge.nodes.map(n => renderNode(n)).join('') + '</div>';
  h += '</div>';
  return h;
}

function renderSpecCard(icon, title, items){
  return `<div class="spec-card"><h4><i class="ti ${icon}"></i>${title}</h4><ul>` +
    items.map(it => `<li>${it}</li>`).join('') + '</ul></div>';
}

function renderSeqView(d, tabsKey, note){
  d = d || SEQ;
  tabsKey = tabsKey || 'seq';
  let h = `<div class="view-hero"><h1>${d.hero.title[0]}<span class="em">${d.hero.title[1]}</span></h1><p>${d.hero.desc}</p>`;
  h += '<div class="hero-meta">' + d.hero.meta.map(m => `<div><span class="num">${m[0]}</span><span class="lbl">${m[1]}</span></div>`).join('') + '</div></div>';
  if(d.sections.length > 1){
    h += `<div class="mod-tabs" data-tabs="${tabsKey}">`;
    d.sections.forEach((s,i) => { h += `<button class="mod-tab${i===0?' active':''}" data-mod="${s.id}">${s.label}</button>`; });
    h += '</div>';
  }
  if(note !== false){
    h += '<div class="seq-note"><i class="ti ti-info-circle"></i><span>' + (note || 'Each flow shows the full message exchange across the customer app, platform services, and vendor app — including branches (<b>alt</b>), optional steps (<b>opt</b>), loops, and parallel fan-out (<b>par</b>). Diagrams adapt to the light/dark theme.') + '</span></div>';
  }
  d.sections.forEach((s,i) => {
    h += `<div class="mod${i===0?' active':''}" id="mod-${s.id}">`;
    h += `<div class="mod-head"><h2>${s.title}</h2><p>${s.subtitle}</p></div>`;
    h += `<div class="seq-diagram"><div class="mermaid" id="mer-${s.id}"><div class="seq-loading">Rendering diagram…</div></div></div>`;
    h += '<div class="spec-grid">';
    if(s.cards){
      s.cards.forEach(c => { h += renderSpecCard(c.icon, c.title, c.items); });
    } else if(s.spec){
      h += renderSpecCard('ti-api', 'Endpoints', s.spec.endpoints);
      h += renderSpecCard('ti-broadcast', 'Real-time events', s.spec.events);
      h += renderSpecCard('ti-arrows-transfer-down', 'State transitions', s.spec.states);
      h += renderSpecCard('ti-alert-triangle', 'Edge cases & failure paths', s.spec.edge);
    }
    h += '</div>';
    h += '</div>';
  });
  return h;
}

function initMermaid(){
  if(typeof mermaid === 'undefined') return;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const tv = dark ? {
    primaryColor:'#2a261f', primaryBorderColor:'#e07a9e', primaryTextColor:'#f0ede4',
    lineColor:'#8e8a80', secondaryColor:'#251f3e', tertiaryColor:'#16140f',
    actorBkg:'#2a261f', actorBorder:'#e07a9e', actorTextColor:'#f0ede4', actorLineColor:'#6a665e',
    signalColor:'#b6b2a8', signalTextColor:'#d8d4ca',
    noteBkgColor:'#3a2510', noteTextColor:'#fac775', noteBorderColor:'#8a5a1e',
    labelBoxBkgColor:'#251f3e', labelBoxBorderColor:'#4a4290', labelTextColor:'#cecbf6',
    loopTextColor:'#cecbf6', activationBkgColor:'#332e26', activationBorderColor:'#e07a9e'
  } : {
    primaryColor:'#f6e1ea', primaryBorderColor:'#8a1e47', primaryTextColor:'#211f1d',
    lineColor:'#8d8a82', secondaryColor:'#eeedfe', tertiaryColor:'#f1eee7',
    actorBkg:'#ffffff', actorBorder:'#8a1e47', actorTextColor:'#211f1d', actorLineColor:'#c9c5bc',
    signalColor:'#7a766e', signalTextColor:'#5f5c56',
    noteBkgColor:'#faeeda', noteTextColor:'#633806', noteBorderColor:'#ef9f27',
    labelBoxBkgColor:'#eeedfe', labelBoxBorderColor:'#afa9ec', labelTextColor:'#3c3489',
    loopTextColor:'#3c3489', activationBkgColor:'#f1eee7', activationBorderColor:'#8a1e47'
  };
  mermaid.initialize({
    startOnLoad:false, theme:'base', securityLevel:'loose',
    fontFamily:"'IBM Plex Sans', sans-serif", themeVariables: tv,
    flowchart:{ useMaxWidth:true, htmlLabels:true },
    sequence:{ useMaxWidth:true, mirrorActors:false, wrap:true, actorMargin:46, boxMargin:9, noteMargin:9, messageMargin:34 }
  });
}

/* Render only the diagrams that are currently VISIBLE. Mermaid cannot measure
   text inside display:none containers, which is what caused labels to overlap
   in inactive tabs. We therefore (re)initialize for the current theme and lazily
   render each diagram the first time its tab/view becomes visible. */
function renderVisibleMermaid(){
  if(typeof mermaid === 'undefined') return;
  initMermaid();
  const toRender = [];
  document.querySelectorAll('.mermaid').forEach(el => {
    if(!el._src) return;
    const visible = el.offsetParent !== null;
    if(visible && !el._rendered){
      el.removeAttribute('data-processed');
      el.textContent = el._src;
      toRender.push(el);
    }
  });
  if(!toRender.length) return;
  toRender.forEach(el => { el._rendered = true; });
  try { mermaid.run({ nodes: toRender }); } catch(e){ /* no-op */ }
}

/* Force every diagram to re-render (used on theme switch). */
function resetMermaid(){
  document.querySelectorAll('.mermaid').forEach(el => { el._rendered = false; });
  renderVisibleMermaid();
}

document.getElementById('view-vendor').innerHTML = renderFlowView(VENDOR,'vendor');
document.getElementById('view-user').innerHTML = renderFlowView(USER,'user');
document.getElementById('view-e2e').innerHTML = renderE2E();
document.getElementById('view-seq').innerHTML = renderSeqView(SEQ, 'seq');
document.getElementById('view-flow').innerHTML = renderSeqView(WORKFLOW, 'flow', 'A bird\u2019s-eye view of the entire platform: the unified booking\u2192settlement sequence, the booking state machine, and the service architecture. Switch sub-tabs to move between them; diagrams adapt to the light/dark theme.');
document.getElementById('view-dispatch').innerHTML = renderDispatch();
[...SEQ.sections, ...WORKFLOW.sections].forEach(s => {
  const el = document.getElementById('mer-' + s.id);
  if(el){ el._src = s.mer; }
});
(function(){ const el = document.getElementById('mer-sd-flow'); if(el){ el._src = DISPATCH.flow.mer; } })();

/* ============ INTERACTIONS ============ */
document.getElementById('viewNav').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if(!btn) return;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + btn.dataset.view).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
  renderVisibleMermaid();
});

document.body.addEventListener('click', e => {
  const tab = e.target.closest('.mod-tab');
  if(!tab) return;
  const group = tab.closest('.mod-tabs');
  group.querySelectorAll('.mod-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  const view = tab.closest('.view');
  view.querySelectorAll('.mod').forEach(m => m.classList.remove('active'));
  view.querySelector('#mod-' + tab.dataset.mod).classList.add('active');
  renderVisibleMermaid();
});

const tt = document.getElementById('themeToggle');
const html = document.documentElement;
function setTheme(t){
  html.setAttribute('data-theme', t);
  tt.innerHTML = t === 'dark' ? '<i class="ti ti-sun"></i>' : '<i class="ti ti-moon"></i>';
  try { localStorage.setItem('lld-theme', t); } catch(e){}
  resetMermaid();
}
tt.addEventListener('click', () => setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
try {
  const saved = localStorage.getItem('lld-theme');
  if(saved) setTheme(saved);
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
} catch(e){}

document.getElementById('footStamp').textContent = 'generated ' + new Date().toISOString().slice(0,10);

renderVisibleMermaid();
</script>
