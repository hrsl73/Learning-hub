  <path d="M 256 160 C 302 135 372 135 416 150 L 416 355 C 372 340 302 340 256 365 Z" fill="#ffffff" opacity="0.85" />
  <!-- Center Spine Divider -->
  <path d="M 256 155 L 256 365" stroke="#6366f1" stroke-width="10" stroke-linecap="round" />
  
  <!-- Subtle Page Accent Lines -->
  <path d="M 140 210 Q 185 200 220 212" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 140 250 Q 185 240 220 252" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 292 212 Q 327 200 372 210" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 292 252 Q 327 240 372 250" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.4" />
</svg>
